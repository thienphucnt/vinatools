<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mất kết nối Internet - VinaTools</title>
  <style>
    :root {
      --bg-dark: #0a0c10;
      --panel-glass: rgba(18, 22, 32, 0.95);
      --border-glass: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #8b5cf6;
      --accent-secondary: #ec4899;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .offline-card {
      background: var(--panel-glass);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    
    .icon-container {
      font-size: 4rem;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    
    .btn:active {
      transform: translateY(1px);
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="icon-container">🔌</div>
    <h1>Mất kết nối Internet</h1>
    <p>Rất tiếc! Hiện tại bạn đang ngoại tuyến. Vui lòng kiểm tra lại kết nối mạng trên thiết bị để tiếp tục sử dụng các biểu mẫu và công cụ.</p>
    <a href="/" class="btn">Thử tải lại Trang chủ</a>
  </div>
</body>
</html>
